<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Keepie-Uppie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0C2218;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    touch-action: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
// ────────────────────────────────────────────────────────────
// KEEPIE-UPPIE — a proper arcade game
// Core loop: tap the ball before it hits the ground.
// Difficulty: gravity increases, wind gusts appear, ball speeds up.
// Combo system: 5-in-a-row triggers "ON FIRE" mode.
// ────────────────────────────────────────────────────────────

const W = Math.min(window.innerWidth, 420);
const H = window.innerHeight;

const BALL_RADIUS  = 28;
const GRAVITY_BASE = 600;
const KICK_POWER   = 520;
const COMBO_FIRE   = 5;      // kicks needed for ON FIRE
const WIND_AFTER   = 15;     // wind starts after this many kicks
const COLORS = {
  bg:         0x0C2218,
  pitch:      0x1B4332,
  pitchLight: 0x2D6A4F,
  gold:       0xF4A300,
  white:      0xF8F7F2,
  red:        0xD62828,
  dark:       0x16191A,
};

// ── Shared game state ──────────────────────────────────────
let highScore = 0;

// ══════════════════════════════════════════════════════════
//  SCENE: Boot — just sets background and goes to Game
// ══════════════════════════════════════════════════════════
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.scene.start('Menu');
  }
}

// ══════════════════════════════════════════════════════════
//  SCENE: Menu
// ══════════════════════════════════════════════════════════
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    const cx = W / 2, cy = H / 2;

    // Background grass lines
    this.drawGrass();

    // Title
    this.add.text(cx, cy - 160, 'KEEPIE', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '52px',
      color: '#F4A300',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    this.add.text(cx, cy - 110, 'UPPIE', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '52px',
      color: '#F8F7F2',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    // Animated ball
    const ballGraphic = this.add.circle(cx, cy - 10, BALL_RADIUS, COLORS.white);
    this.add.text(cx, cy - 10, '⚽', { fontSize: `${BALL_RADIUS * 1.4}px` }).setOrigin(0.5);

    this.tweens.add({
      targets: ballGraphic,
      y: cy - 20,
      duration: 800,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
    });

    // Instructions
    this.add.text(cx, cy + 55, 'Tap the ball to keep it up', {
      fontFamily: 'Arial',
      fontSize: '16px',
      color: '#F8F7F2AA',
    }).setOrigin(0.5);

    this.add.text(cx, cy + 85, 'Don\'t let it hit the ground!', {
      fontFamily: 'Arial',
      fontSize: '16px',
      color: '#F8F7F2AA',
    }).setOrigin(0.5);

    // Combo tip
    this.add.text(cx, cy + 125, '🔥 5 in a row = ON FIRE mode', {
      fontFamily: 'Arial',
      fontSize: '14px',
      color: '#F4A30099',
    }).setOrigin(0.5);

    // High score
    if (highScore > 0) {
      this.add.text(cx, cy + 165, `Best: ${highScore}`, {
        fontFamily: 'Arial Black, Arial',
        fontSize: '18px',
        color: '#F4A300',
      }).setOrigin(0.5);
    }

    // Start button
    const btn = this.add.rectangle(cx, cy + 220, 200, 56, COLORS.gold, 1)
      .setInteractive({ useHandCursor: true });
    this.add.text(cx, cy + 220, 'PLAY', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '24px',
      color: '#16191A',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    btn.on('pointerdown', () => {
      this.cameras.main.fade(200, 0, 0, 0);
      this.time.delayedCall(200, () => this.scene.start('Game'));
    });

    // Pulse the button
    this.tweens.add({
      targets: btn,
      scaleX: 1.04,
      scaleY: 1.04,
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut',
    });
  }

  drawGrass() {
    const g = this.add.graphics();
    // Alternating grass strips
    for (let i = 0; i < 10; i++) {
      g.fillStyle(i % 2 === 0 ? COLORS.pitch : COLORS.pitchLight, 0.4);
      g.fillRect(0, i * (H / 10), W, H / 10);
    }
  }
}

// ══════════════════════════════════════════════════════════
//  SCENE: Game — the actual game
// ══════════════════════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor() {
    super('Game');
    this.ball       = null;
    this.score      = 0;
    this.combo      = 0;
    this.onFire     = false;
    this.alive      = false;
    this.wind       = 0;
    this.windTimer  = null;
  }

  create() {
    this.score  = 0;
    this.combo  = 0;
    this.onFire = false;
    this.alive  = true;
    this.wind   = 0;

    const cx = W / 2;

    // ── Background ──────────────────────────────────────────
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.drawGrass();

    // ── Physics world ───────────────────────────────────────
    this.physics.world.gravity.y = GRAVITY_BASE;
    this.physics.world.setBounds(0, 0, W, H + 100);

    // ── Ground (death zone) ─────────────────────────────────
    this.ground = this.physics.add.staticGroup();
    const groundBar = this.add.rectangle(cx, H + 20, W, 40, COLORS.dark, 0);
    this.physics.add.existing(groundBar, true);
    this.ground.add(groundBar);

    // Visible ground line
    const groundLine = this.add.graphics();
    groundLine.lineStyle(3, COLORS.gold, 0.4);
    groundLine.lineBetween(0, H - 4, W, H - 4);

    // ── Ball ────────────────────────────────────────────────
    this.ballContainer = this.add.container(cx, H * 0.35);

    // Ball gfx (drawn procedurally — proper football pattern)
    this.ballGfx = this.add.graphics();
    this.drawBall(this.ballGfx, 0, 0, false);
    this.ballContainer.add(this.ballGfx);

    // Physics body for the ball
    this.ball = this.physics.add.image(cx, H * 0.35, '__DEFAULT');
    this.ball.setVisible(false);
    this.ball.setCircle(BALL_RADIUS, -BALL_RADIUS, -BALL_RADIUS);
    this.ball.setCollideWorldBounds(false);
    this.ball.setBounce(0.3);
    this.ball.setVelocity((Math.random() - 0.5) * 120, -200);
    this.ball.setDrag(20, 0);

    // ── Ground collision → die ───────────────────────────────
    this.physics.add.overlap(this.ball, this.ground, () => {
      if (this.alive) this.die();
    });

    // ── Input ───────────────────────────────────────────────
    this.input.on('pointerdown', (pointer) => {
      if (!this.alive) return;
      this.tryKick(pointer.x, pointer.y);
    });

    // ── UI ──────────────────────────────────────────────────
    this.scoreText = this.add.text(cx, 36, '0', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '56px',
      color: '#F8F7F2',
      fontStyle: 'bold',
    }).setOrigin(0.5).setDepth(10);

    this.comboText = this.add.text(cx, 90, '', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '18px',
      color: '#F4A300',
    }).setOrigin(0.5).setDepth(10).setAlpha(0);

    this.windText = this.add.text(cx, H - 28, '', {
      fontFamily: 'Arial',
      fontSize: '14px',
      color: '#F8F7F2AA',
    }).setOrigin(0.5).setDepth(10);

    this.fireOverlay = this.add.text(cx, H * 0.15, '🔥 ON FIRE 🔥', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '22px',
      color: '#F4A300',
    }).setOrigin(0.5).setDepth(10).setAlpha(0);

    // ── Particle emitter for kicks ───────────────────────────
    this.particles = this.add.particles(0, 0, '__DEFAULT', {
      lifespan: 500,
      speed: { min: 60, max: 150 },
      scale: { start: 0.4, end: 0 },
      alpha: { start: 0.9, end: 0 },
      tint: [COLORS.gold, COLORS.white, 0xFFD166],
      angle: { min: 0, max: 360 },
      gravityY: 200,
      quantity: 0,
      emitting: false,
    });
    this.particles.setDepth(5);

    // ── Wind system ─────────────────────────────────────────
    this.windTimer = this.time.addEvent({
      delay: 3500,
      loop: true,
      callback: this.changeWind,
      callbackScope: this,
    });

    // ── Camera intro ────────────────────────────────────────
    this.cameras.main.fadeIn(250);
  }

  drawGrass() {
    const g = this.add.graphics();
    for (let i = 0; i < 10; i++) {
      g.fillStyle(i % 2 === 0 ? COLORS.pitch : COLORS.pitchLight, 0.5);
      g.fillRect(0, i * (H / 10), W, H / 10);
    }
  }

  drawBall(g, x, y, onFire) {
    g.clear();
    // Shadow
    g.fillStyle(0x000000, 0.2);
    g.fillEllipse(x + 3, y + 4, BALL_RADIUS * 2 - 4, BALL_RADIUS * 1.2);
    // Main circle — white
    g.fillStyle(COLORS.white, 1);
    g.fillCircle(x, y, BALL_RADIUS);
    // Pentagon patches (simplified football pattern)
    g.fillStyle(COLORS.dark, 1);
    g.fillPolygon([
      { x: x,      y: y - 12 },
      { x: x + 11, y: y - 4  },
      { x: x + 7,  y: y + 9  },
      { x: x - 7,  y: y + 9  },
      { x: x - 11, y: y - 4  },
    ]);
    // Side patches
    g.fillStyle(COLORS.dark, 0.7);
    g.fillCircle(x + 16, y - 10, 5);
    g.fillCircle(x - 16, y - 10, 5);
    g.fillCircle(x + 16, y + 12, 4);
    g.fillCircle(x - 16, y + 12, 4);
    // ON FIRE glow ring
    if (onFire) {
      g.lineStyle(3, COLORS.gold, 0.8);
      g.strokeCircle(x, y, BALL_RADIUS + 5);
      g.lineStyle(2, 0xFF6600, 0.5);
      g.strokeCircle(x, y, BALL_RADIUS + 10);
    }
    // Shine
    g.fillStyle(COLORS.white, 0.4);
    g.fillCircle(x - 8, y - 8, 6);
  }

  tryKick(tapX, tapY) {
    const bx = this.ball.x;
    const by = this.ball.y;
    const dist = Phaser.Math.Distance.Between(tapX, tapY, bx, by);
    const hitRadius = BALL_RADIUS * 3; // generous hit area for mobile

    if (dist > hitRadius) {
      // Missed — visual hint but don't punish yet (only ground = death)
      this.showMissHint(tapX, tapY);
      return;
    }

    // ── Successful kick ──────────────────────────────────────
    this.score++;
    this.combo++;

    // Difficulty scaling — gravity and speed increase with score
    const gravScale = 1 + Math.min(this.score * 0.015, 0.8);
    this.physics.world.gravity.y = GRAVITY_BASE * gravScale;

    // Kick power — centered tap = full power, edge tap = less
    const hitQuality = 1 - (dist / hitRadius);
    const power = KICK_POWER * (0.7 + hitQuality * 0.3);

    // Direction — mostly up, slight angle toward center of screen
    const angleToCenter = Phaser.Math.Angle.Between(bx, by, W / 2, H / 2);
    const kickVX = this.ball.body.velocity.x * 0.3 + Math.cos(angleToCenter) * 80 + (Math.random() - 0.5) * 100;
    const kickVY = -power + (Math.random() - 0.5) * 60;

    this.ball.setVelocity(kickVX, kickVY);

    // ON FIRE mode
    if (this.combo >= COMBO_FIRE) {
      if (!this.onFire) {
        this.onFire = true;
        this.showFireMode();
      }
    }

    // Particles burst
    this.particles.setPosition(bx, by);
    this.particles.explode(this.onFire ? 20 : 10);

    // Score pop animation
    this.scoreText.setText(this.score);
    this.tweens.add({
      targets: this.scoreText,
      scaleX: 1.3,
      scaleY: 1.3,
      duration: 100,
      yoyo: true,
      ease: 'Back.easeOut',
    });

    // Combo text
    if (this.combo >= 3) {
      const labels = ['', '', '', '3x Combo!', '4x Combo!', '🔥 ON FIRE!', '🔥 x' + this.combo];
      const label = this.combo < labels.length ? labels[this.combo] : '🔥 x' + this.combo;
      this.comboText.setText(label);
      this.tweens.add({
        targets: this.comboText,
        alpha: 1,
        duration: 100,
        onComplete: () => {
          this.tweens.add({
            targets: this.comboText,
            alpha: 0,
            duration: 400,
            delay: 600,
          });
        },
      });
    }

    // Screen flash on kick
    this.cameras.main.flash(60, 255, 255, 200, false, null, this);

    // Update score display
    if (this.score > highScore) {
      highScore = this.score;
      this.scoreText.setColor('#F4A300');
    }
  }

  showMissHint(x, y) {
    const hint = this.add.text(x, y, '✕', {
      fontFamily: 'Arial',
      fontSize: '22px',
      color: '#D62828AA',
    }).setOrigin(0.5).setDepth(20);
    this.tweens.add({
      targets: hint,
      alpha: 0,
      y: y - 20,
      duration: 400,
      onComplete: () => hint.destroy(),
    });
  }

  showFireMode() {
    this.tweens.add({
      targets: this.fireOverlay,
      alpha: 1,
      duration: 200,
      onComplete: () => {
        this.tweens.add({
          targets: this.fireOverlay,
          alpha: 0,
          duration: 400,
          delay: 1000,
        });
      },
    });
    // Camera shake
    this.cameras.main.shake(300, 0.005);
  }

  changeWind() {
    if (!this.alive || this.score < WIND_AFTER) return;
    // Random wind strength, direction changes periodically
    this.wind = (Math.random() - 0.5) * 120 * (1 + this.score / 100);
    const dir = this.wind > 0 ? '→' : '←';
    const strength = Math.abs(Math.round(this.wind / 20));
    if (strength > 1) {
      this.windText.setText(`Wind ${dir.repeat(Math.min(strength, 4))}`);
    } else {
      this.windText.setText('');
    }
    this.time.delayedCall(1800, () => {
      if (this.alive) { this.wind = 0; this.windText.setText(''); }
    });
  }

  die() {
    if (!this.alive) return;
    this.alive = false;

    // Stop ball
    this.ball.setVelocity(0, 0);
    this.ball.body.allowGravity = false;

    // Big camera shake
    this.cameras.main.shake(400, 0.018);
    this.cameras.main.flash(200, 214, 40, 40);

    // Submit score
    const finalScore = this.score;
    window.parent.postMessage({ type: 'GAME_SCORE', score: finalScore, game: 'keepie-uppie' }, '*');

    // Transition to GameOver scene
    this.time.delayedCall(600, () => {
      this.cameras.main.fade(300, 0, 0, 0);
      this.time.delayedCall(300, () => {
        this.scene.start('GameOver', { score: finalScore });
      });
    });
  }

  update() {
    if (!this.alive) return;

    // Sync ball graphic with physics body
    this.ballGfx.x = this.ball.x;
    this.ballGfx.y = this.ball.y;
    this.drawBall(this.ballGfx, 0, 0, this.onFire);

    // Rotate ball based on horizontal velocity
    this.ballContainer.rotation += (this.ball.body.velocity.x / 800);

    // Apply wind
    if (this.wind !== 0) {
      this.ball.body.velocity.x += this.wind * 0.016;
    }

    // Clamp horizontal velocity to keep ball on screen
    const vx = Phaser.Math.Clamp(this.ball.body.velocity.x, -400, 400);
    this.ball.body.velocity.x = vx;

    // Bounce off walls
    if (this.ball.x < BALL_RADIUS) {
      this.ball.x = BALL_RADIUS;
      this.ball.setVelocityX(Math.abs(this.ball.body.velocity.x));
    }
    if (this.ball.x > W - BALL_RADIUS) {
      this.ball.x = W - BALL_RADIUS;
      this.ball.setVelocityX(-Math.abs(this.ball.body.velocity.x));
    }
  }
}

// ══════════════════════════════════════════════════════════
//  SCENE: GameOver
// ══════════════════════════════════════════════════════════
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }

  init(data) {
    this.finalScore = data.score || 0;
  }

  create() {
    const cx = W / 2, cy = H / 2;
    this.cameras.main.setBackgroundColor(COLORS.bg);
    this.cameras.main.fadeIn(300);

    // Grass bg
    const g = this.add.graphics();
    for (let i = 0; i < 10; i++) {
      g.fillStyle(i % 2 === 0 ? COLORS.pitch : COLORS.pitchLight, 0.3);
      g.fillRect(0, i * (H / 10), W, H / 10);
    }

    // Result emoji
    const emoji = this.finalScore >= 50 ? '🏆' : this.finalScore >= 20 ? '⭐' : this.finalScore >= 10 ? '👍' : '😅';
    this.add.text(cx, cy - 190, emoji, { fontSize: '64px' }).setOrigin(0.5);

    // Score
    this.add.text(cx, cy - 120, String(this.finalScore), {
      fontFamily: 'Arial Black, Arial',
      fontSize: '88px',
      color: this.finalScore >= highScore && this.finalScore > 0 ? '#F4A300' : '#F8F7F2',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    this.add.text(cx, cy - 35, 'TOUCHES', {
      fontFamily: 'Arial',
      fontSize: '14px',
      color: '#F8F7F277',
      letterSpacing: 4,
    }).setOrigin(0.5);

    // Personal best badge
    if (this.finalScore >= highScore && this.finalScore > 0) {
      const badge = this.add.rectangle(cx, cy + 15, 180, 34, COLORS.gold);
      this.add.text(cx, cy + 15, '⭐ NEW BEST', {
        fontFamily: 'Arial Black, Arial',
        fontSize: '15px',
        color: '#16191A',
        fontStyle: 'bold',
      }).setOrigin(0.5);
      this.tweens.add({ targets: badge, scaleX: 1.05, scaleY: 1.05, duration: 500, yoyo: true, repeat: -1 });
    } else if (highScore > 0) {
      this.add.text(cx, cy + 18, `Best: ${highScore}`, {
        fontFamily: 'Arial',
        fontSize: '16px',
        color: '#F4A30099',
      }).setOrigin(0.5);
    }

    // Score rating text
    const rating = this.finalScore >= 50 ? 'LEGEND STATUS!' :
                   this.finalScore >= 20 ? 'Brilliant juggling!' :
                   this.finalScore >= 10 ? 'Getting better!' : 'Keep practising!';
    this.add.text(cx, cy + 58, rating, {
      fontFamily: 'Arial',
      fontSize: '15px',
      color: '#F8F7F2BB',
    }).setOrigin(0.5);

    // Play again
    const playBtn = this.add.rectangle(cx, cy + 130, 220, 60, COLORS.gold)
      .setInteractive({ useHandCursor: true });
    this.add.text(cx, cy + 130, 'PLAY AGAIN', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '22px',
      color: '#16191A',
      fontStyle: 'bold',
    }).setOrigin(0.5);

    playBtn.on('pointerdown', () => {
      this.cameras.main.fade(200, 0, 0, 0);
      this.time.delayedCall(200, () => this.scene.start('Game'));
    });

    // Back to menu
    const menuBtn = this.add.rectangle(cx, cy + 210, 180, 48, COLORS.pitchLight)
      .setInteractive({ useHandCursor: true });
    this.add.text(cx, cy + 210, 'MENU', {
      fontFamily: 'Arial Black, Arial',
      fontSize: '18px',
      color: '#F8F7F2',
    }).setOrigin(0.5);

    menuBtn.on('pointerdown', () => {
      this.cameras.main.fade(200, 0, 0, 0);
      this.time.delayedCall(200, () => this.scene.start('Menu'));
    });

    // Button press feel
    [playBtn, menuBtn].forEach(btn => {
      btn.on('pointerover', () => btn.setAlpha(0.85));
      btn.on('pointerout',  () => btn.setAlpha(1));
      btn.on('pointerdown', () => { btn.setScale(0.95); });
      btn.on('pointerup',   () => { btn.setScale(1); });
    });
  }
}

// ══════════════════════════════════════════════════════════
//  PHASER CONFIG
// ══════════════════════════════════════════════════════════
const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: COLORS.bg,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: GRAVITY_BASE }, debug: false },
  },
  scene: [BootScene, MenuScene, GameScene, GameOverScene],
  parent: document.body,
  scale: {
    mode: Phaser.Scale.NONE,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  input: { activePointers: 3 },
};

const game = new Phaser.Game(config);

// ── Score relay to parent Next.js page ──────────────────────
window.addEventListener('message', (e) => {
  // Allow the parent page to also tell us the current high score
  if (e.data?.type === 'SET_HIGH_SCORE') {
    highScore = e.data.score || 0;
  }
});
</script>
</body>
</html>
